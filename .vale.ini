StylesPath = .vale/styles
MinAlertLevel = warning

# Historical archives keep their original vocabulary; the glossary decodes it.
[*.md]
BasedOnStyles = Jargon

[docs/fork/*]
BasedOnStyles =

[docs/archive/*]
BasedOnStyles =

[docs/GLOSSARY.md]
BasedOnStyles =

# The style guide has to quote the discouraged words in order to name them.
[.apm/skills/plain-language/*]
BasedOnStyles =

# CI enforces this log as append-only (governance-root.yml rejects any deletion),
# so a finding in an existing entry can never be corrected. Linting it would pin
# the check red for good. The glossary decodes the vocabulary instead.
[docs/architecture/GOVERNANCE_DECISIONS.md]
BasedOnStyles =
