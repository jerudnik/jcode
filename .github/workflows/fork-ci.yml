name: Fork CI

on:
  workflow_call:
    inputs:
      broad:
        description: Run the broad full-test recipe as well as the fast ones.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          key: fork-ci

      - name: Run check recipe
        run: nix shell nixpkgs#just -c just check

      - name: Run test recipe
        run: nix shell nixpkgs#just -c just test

      - name: Run full-test recipe
        if: ${{ inputs.broad }}
        run: nix shell nixpkgs#just -c just full-test
