name: Fork CI

on:
  workflow_call:
    inputs:
      broad:
        description: Run the broad full-test recipe as well as the fast ones.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    # full-test rebuilds release for the explicit host target and runs the
    # whole suite; 45 minutes gets cancelled mid-run on a cold cache. The old
    # Linux test job allowed 90.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31 cachix/install-nix-action@v31

      # install-nix-action exports TMPDIR=$RUNNER_TEMP (/home/runner/work/_temp),
      # which sits under the runner's real home. Tests that create tempdirs and
      # point $XDG_CONFIG_HOME at them (e.g. jcode-base
      # save_github_token_creates_config_dir) then have the override discarded
      # by sanitize_ambient_dir_override, which ignores ambient dirs under the
      # real home while the test harness redirects it. Restore the default so
      # test tempdirs land outside the home directory.
      - name: Keep test tempdirs outside the runner home
        run: echo "TMPDIR=/tmp" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          key: fork-ci

      - name: Run check recipe
        run: nix shell nixpkgs#just -c just check

      - name: Run test recipe
        run: nix shell nixpkgs#just -c just test

      - name: Run full-test recipe
        if: ${{ inputs.broad }}
        run: nix shell nixpkgs#just -c just full-test
