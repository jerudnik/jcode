name: PR Gate

on:
  workflow_call:
    inputs:
      docs_only:
        description: Skip the broad route for docs-only pull requests.
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  docs:
    name: Docs lint
    if: ${{ inputs.docs_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run docs lint recipe
        run: nix shell nixpkgs#just nixpkgs#vale nixpkgs#python3 -c just lint-docs

  fork-ci:
    name: Fork CI
    if: ${{ !inputs.docs_only }}
    uses: ./.github/workflows/fork-ci.yml
    secrets: inherit
    with:
      broad: true

  security:
    name: Security
    if: ${{ !inputs.docs_only }}
    uses: ./.github/workflows/security.yml
    secrets: inherit
    with:
      strict: true
      weekly: false

  nix:
    name: Nix
    if: ${{ !inputs.docs_only }}
    uses: ./.github/workflows/nix.yml
    secrets: inherit
    with:
      publish: false

  smoke:
    name: Smoke
    if: ${{ !inputs.docs_only }}
    uses: ./.github/workflows/freebsd-smoke.yml
    secrets: inherit
