name: PR Gate

on:
  workflow_call:
    inputs:
      docs_only:
        description: Skip the broad route for docs-only pull requests.
        required: true
        type: boolean
      product_impacting:
        description: >-
          Some changed path can alter the built artifact, so the legs that
          exercise it must run: the full-test recipe, the Nix package build,
          and the smoke check. False only for change sets the classifier
          recognises as inert to a build, such as a governance workflow edit,
          which the workflow linters and contract tests still judge in full.
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  docs:
    name: Docs lint
    # Runs on every pull request, not only docs-only ones. Gating it on
    # docs_only meant a PR that touched one code file and one doc file skipped
    # the linter entirely -- the docs were checked exactly when they were the
    # only thing changed, and unchecked whenever they shipped alongside code.
    # Measured over the 25 most recent runs: median 31s, max 34s.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run docs lint recipe
        run: nix shell nixpkgs#just nixpkgs#vale nixpkgs#python3 -c just lint-docs

  fork-ci:
    name: Fork CI
    if: ${{ !inputs.docs_only }}
    uses: ./.github/workflows/fork-ci.yml
    secrets: inherit
    with:
      broad: ${{ inputs.product_impacting }}

  security:
    name: Security
    if: ${{ !inputs.docs_only }}
    uses: ./.github/workflows/security.yml
    secrets: inherit
    with:
      strict: true
      weekly: false

  nix:
    name: Nix
    if: ${{ !inputs.docs_only }}
    uses: ./.github/workflows/nix.yml
    secrets: inherit
    with:
      publish: false
      build_package: ${{ inputs.product_impacting }}

  smoke:
    name: Smoke
    if: ${{ !inputs.docs_only && inputs.product_impacting }}
    uses: ./.github/workflows/freebsd-smoke.yml
    secrets: inherit
