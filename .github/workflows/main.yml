name: Main

on:
  push:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    uses: ./.github/workflows/nix.yml
    secrets: inherit
    with:
      publish: true

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-check recipe
        run: nix shell nixpkgs#just -c just release-check
