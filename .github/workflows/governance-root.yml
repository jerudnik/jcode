name: Governance Root

# Audit gate: runs from the pull request head like any other workflow, so it
# detects an unreviewed governance-path change on the PR that makes it rather
# than preventing one. Legitimate governance-path changes go through the
# transaction-bound maintenance procedure in design.md section 4.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-root:
    name: Governance Root
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch the trusted main boundary
        run: git fetch --force --no-tags origin main:refs/remotes/origin/main

      - name: Detect governance-path changes
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD refs/remotes/origin/main)"
          protected=(
            .github/workflows
            scripts/required-checks.json
            scripts/fork-health.sh
            scripts/governance_compare.py
            scripts/generate_governance_fixture.py
            justfile
            scripts/check_guard_nonvacuity.py
            tests/test_guard_nonvacuity.py
            tests/test_governance_compare.py
            tests/test_classify_pr_paths.py
          )
          if ! git diff --quiet "$base" HEAD -- "${protected[@]}"; then
            echo "::error::governance paths changed; use the recorded ruleset maintenance procedure (docs/architecture/GOVERNANCE_DECISIONS.md, 'Ruleset maintenance window')"
            git diff --name-only "$base" HEAD -- "${protected[@]}"
            exit 1
          fi

          # The decision log is protected against destructive edits only. Appending an
          # entry is routine -- 34 commits in the three months to 2026-08-17 -- and must
          # not cost a maintenance window, or the control would penalise recording
          # decisions. Losing the log is the failure PR #155 nearly caused. A rename
          # reads as a deletion here, which is correct: moving the log is a governance
          # event.
          log=docs/architecture/GOVERNANCE_DECISIONS.md
          if ! git diff --quiet "$base" HEAD -- "$log"; then
            removed="$(git diff --numstat "$base" HEAD -- "$log" | awk '{print $2}')"
            if [ ! -f "$log" ] || [ "${removed:-0}" -ne 0 ]; then
              echo "::error::$log lost ${removed:-all} line(s) or was removed; the decision log is append-only (see its 'Ruleset maintenance window' section)"
              exit 1
            fi
          fi
