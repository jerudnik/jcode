name: Security

on:
  workflow_call:
    inputs:
      strict:
        description: Must be true; the reusable workflow has no non-strict mode.
        required: true
        type: boolean
      weekly:
        description: Include the scheduled advisory report.
        required: false
        type: boolean
        default: false

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Install secret and audit tools
        run: |
          nix build nixpkgs#gitleaks --out-link "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP/gitleaks/bin" >> "$GITHUB_PATH"
          nix build nixpkgs#cargo-audit --out-link "$RUNNER_TEMP/cargo-audit"
          echo "$RUNNER_TEMP/cargo-audit/bin" >> "$GITHUB_PATH"

      - name: Reject non-strict calls
        if: ${{ !inputs.strict }}
        run: |
          echo "::error::security.yml only supports strict mode"
          exit 1

      - name: Run security preflight
        run: scripts/security_preflight.sh --strict

      - name: Verify the advisory policy records
        run: python3 scripts/check_advisory_policy.py

      - name: Run weekly advisory report
        if: ${{ inputs.weekly }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .cargo/audit.toml
          cargo audit > audit-report.txt 2>&1 || true
          cat audit-report.txt
          {
            echo '## cargo audit (full, ignores disabled)'
            echo '```'
            tail -100 audit-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          title="Dependency advisories: weekly report"
          body_file="$(mktemp)"
          {
            echo "Weekly full \`cargo audit\` (ignores disabled). Triaged advisories live in \`.cargo/audit.toml\`, with owner, rationale, affected surface, expiry, and retirement condition in \`docs/security/advisories.toml\`."
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            tail -100 audit-report.txt
            echo '```'
          } > "$body_file"

          existing="$(gh issue list --state open --search 'in:title "Dependency advisories: weekly report"' --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file" --label fork-maintenance \
              || gh issue create --title "$title" --body-file "$body_file"
          fi
