name: FreeBSD Smoke

on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run release-check recipe
        run: nix shell nixpkgs#just -c just release-check
