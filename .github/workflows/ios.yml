name: iOS validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCHEME: JCodeMobile

jobs:
  test:
    name: swift test (JCodeKit)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Swift toolchain info
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run JCodeKit tests on macOS
        working-directory: ios
        run: swift test

  compile-check:
    name: xcodebuild (simulator, unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app target for iOS simulator (no signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project JCodeMobile.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -60
