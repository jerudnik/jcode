name: Nix

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      publish:
        description: Push the built package to Cachix from main or a release tag.
        required: false
        type: boolean
        default: false
      rollback_ref:
        description: Previous promoted main-ancestor ref used for release rollback testing.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      publish:
        description: Push the built package to Cachix after validation.
        required: false
        type: boolean
        default: false
      rollback_ref:
        description: Previous promoted main-ancestor ref used for release rollback testing.
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate Nix and workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31 cachix/install-nix-action@v31

      - name: Lint fork-owned workflows
        # Uses the flake-locked .#actionlint compatibility package so CI and
        # the flake workflow-syntax check agree on parser behavior.
        # freebsd-smoke.yml remains the sole upstream exemption.
        run: |
          nix run .#actionlint -- \
            .github/workflows/ci.yml \
            .github/workflows/docs-impact.yml \
            .github/workflows/fork-ci.yml \
            .github/workflows/fork-health.yml \
            .github/workflows/main.yml \
            .github/workflows/security.yml \
            .github/workflows/nix.yml \
            .github/workflows/nix-update.yml \
            .github/workflows/pr.yml \
            .github/workflows/release.yml \
            .github/workflows/scheduled.yml \
            .github/workflows/governance-root.yml

          python3 scripts/check_reusable_workflow_calls.py .
          python3 tests/test_reusable_workflow_calls.py
          python3 scripts/check_workflow_permissions.py .
          python3 -m unittest tests.test_workflow_permissions

      - name: Run package recipe
        run: nix shell nixpkgs#just -c just package

      - name: Run release-check recipe
        run: nix shell nixpkgs#just -c just release-check

      - name: Enforce Nix distribution policy
        run: nix build .#checks.x86_64-linux.nix-distribution-policy --print-build-logs

  build:
    name: Build Nix package (${{ matrix.system }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31 cachix/install-nix-action@v31

      - name: Build package for publication
        run: |
          nix build .#packages.${{ matrix.system }}.jcode --print-build-logs --out-link result-${{ matrix.system }}
          nix build .#packages.${{ matrix.system }}.jcode-deps --print-build-logs --out-link result-deps-${{ matrix.system }}

  publish:
    name: Require Cachix publication for release tags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate, build]
    if: ${{ inputs.publish || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31 cachix/install-nix-action@v31

      - name: Build package for Cachix
        run: |
          nix build .#packages.x86_64-linux.jcode --print-build-logs --out-link result
          nix build .#packages.x86_64-linux.jcode-deps --print-build-logs --out-link result-deps

      - name: Publish to Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: jerudnik-jcode
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
          pathsToPush: ./result ./result-deps
          cachixArgs: -j2

