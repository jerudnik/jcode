name: Nix

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      publish:
        description: Push the built package to Cachix from main or a release tag.
        required: false
        type: boolean
        default: false
      build_package:
        description: >-
          Build the package. Defaults true so a caller that says nothing gets
          the build; pull requests whose change set cannot affect the artifact
          pass false and rely on the validate job, which still runs.
        required: false
        type: boolean
        default: true
      rollback_ref:
        description: Previous promoted main-ancestor ref used for release rollback testing.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      publish:
        description: Push the built package to Cachix after validation.
        required: false
        type: boolean
        default: false
      build_package:
        description: Build the package.
        required: false
        type: boolean
        default: true
      rollback_ref:
        description: Previous promoted main-ancestor ref used for release rollback testing.
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate Nix and workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31 cachix/install-nix-action@v31

      - name: Lint fork-owned workflows
        # Uses the flake-locked .#actionlint compatibility package so CI and
        # the flake workflow-syntax check agree on parser behavior.
        run: |
          nix run .#actionlint -- \
            .github/workflows/main.yml \
            .github/workflows/security.yml \
            .github/workflows/nix.yml \
            .github/workflows/pr.yml \
            .github/workflows/release.yml \
            .github/workflows/scheduled.yml

          python3 scripts/check_reusable_workflow_calls.py .
          python3 tests/test_reusable_workflow_calls.py

      - name: Run package recipe
        run: nix shell nixpkgs#just -c just package

      - name: Run release-check recipe
        # The dominant step in this job by an order of magnitude, and it builds
        # the artifact rather than validating policy. A change set that cannot
        # affect the artifact skips it here; main runs this same job after the
        # merge, so nothing reaches a release tag without it.
        if: ${{ github.event_name == 'push' || inputs.build_package }}
        run: nix shell nixpkgs#just -c just release-check

      - name: Enforce Nix distribution policy
        run: nix build .#checks.x86_64-linux.nix-distribution-policy --print-build-logs

  build:
    name: Build Nix package (${{ matrix.system }})
    # A tag push carries no inputs, so it is spelled out rather than left to
    # an undefined input evaluating false and skipping the release build.
    if: ${{ github.event_name == 'push' || inputs.build_package }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"system":"x86_64-linux","runner":"ubuntu-latest"}]}' || '{"include":[{"system":"x86_64-linux","runner":"ubuntu-latest"},{"system":"aarch64-darwin","runner":"macos-latest"}]}') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31 cachix/install-nix-action@v31

      - name: Build package for publication
        run: |
          nix build .#packages.${{ matrix.system }}.jcode --print-build-logs --out-link result-${{ matrix.system }}
          nix build .#packages.${{ matrix.system }}.jcode-deps --print-build-logs --out-link result-deps-${{ matrix.system }}

  publish:
    name: Require Cachix publication for release tags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate, build]
    if: ${{ inputs.publish || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31 cachix/install-nix-action@v31

      - name: Build package for Cachix
        run: |
          nix build .#packages.x86_64-linux.jcode --print-build-logs --out-link result
          nix build .#packages.x86_64-linux.jcode-deps --print-build-logs --out-link result-deps

      - name: Publish to Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: jerudnik-jcode
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
          pathsToPush: ./result ./result-deps
          cachixArgs: -j2
