name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Pull request classifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.route.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - id: route
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          docs_only=true

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if [[ "$path" != docs/* && "$path" != *.md && "$path" != README.md && "$path" != CONTRIBUTING.md && "$path" != RELEASING.md ]]; then
              docs_only=false
              break
            fi
          done < <(git diff --name-only "$base" "$head")

          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"

  pr-gate:
    name: PR Gate
    needs: classify
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      docs_only: ${{ needs.classify.outputs.docs_only == 'true' }}
