name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Pull request classifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.route.outputs.docs_only }}
      product_impacting: ${{ steps.route.outputs.product_impacting }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify the guard registry before trusting the route
        shell: bash
        run: |
          set -euo pipefail
          # The non-vacuity harness proves every registered guard can still
          # fail, including the classifier's own claims (it refuses to exempt
          # its change set and fails closed on an unreadable one). Until now
          # the harness ran only inside Fork CI, a leg the routing verdict can
          # switch off -- the detector sat downstream of the decision it
          # audits (docs/issues/classifier-shadow-precedes-its-guard.md).
          # Running it here, before the route is computed, closes that
          # ordering: a weakened guard fails this job, and a failed classify
          # job fails PR Gate through needs.classify.result.
          python3 -I scripts/check_guard_nonvacuity.py

      - id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          route="$RUNNER_TEMP/route.env"
          changed="$RUNNER_TEMP/changed.txt"

          python3 -I scripts/classify_pr_paths.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" > "$route"

          # A pull request that changes how pull requests are routed cannot be
          # routed by the version of that logic it is proposing. For
          # pull_request events the head version of both this workflow and the
          # classifier is what runs, so a weakened classifier would otherwise
          # decide whether the legs that judge it run at all -- and it can do
          # that today without failing any check, because its own path is not
          # protected. This file is. Deciding here does not make the weakening
          # impossible; it makes it trip Governance Root, which is required.
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed"
          set +e
          routing_critical="$(grep -xF \
            -e scripts/classify_pr_paths.py \
            -e .github/workflows/pr.yml \
            "$changed")"
          grep_rc=$?
          set -e
          # 0 matched, 1 matched nothing, anything else is a failure to read the
          # change set at all, which must not be mistaken for "nothing matched".
          if [ "$grep_rc" -gt 1 ]; then
            echo "::error::could not scan the change set for routing-critical paths"
            exit 1
          fi
          if [ -n "$routing_critical" ]; then
            echo "::notice::routing-critical path changed; forcing the full route"
            echo "$routing_critical"
            printf 'docs_only=false\nproduct_impacting=true\n' > "$route"
          fi

          echo "effective route:"
          cat "$route"
          cat "$route" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: classify
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      docs_only: ${{ needs.classify.outputs.docs_only == 'true' }}
      # Compared against 'false' rather than 'true' so an output the classifier
      # never wrote runs the expensive legs instead of silently skipping them.
      product_impacting: ${{ needs.classify.outputs.product_impacting != 'false' }}

  pr-gate:
    name: PR Gate
    needs: [classify, checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      CHECKS_RESULT: ${{ needs.checks.result }}
    steps:
      - name: Require the classifier and every routed check
        shell: bash
        run: |
          set -euo pipefail
          [ "$CLASSIFY_RESULT" = success ] || { echo "::error::pull request classifier concluded '$CLASSIFY_RESULT'"; exit 1; }
          [ "$CHECKS_RESULT" = success ] || { echo "::error::routed checks concluded '$CHECKS_RESULT'"; exit 1; }
