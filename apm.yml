name: jcode-fork
version: 1.0.1
description: APM project for the independent jerudnik Jcode hard fork
author: john rudnik
targets:
- claude
- codex
- copilot
- gemini
- agent-skills
dependencies:
  apm: []
  mcp: []
includes: auto
scripts: {}
# Placement is decided by APM's optimizer from the directory census. Build
# output is excluded so the census does not change with build state.
compilation:
  exclude:
    - "target/**"
    - "target-ttest*/**"
