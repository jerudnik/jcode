title = "jcode gitleaks config"

[extend]
useDefault = true

[allowlist]
paths = [
  '''(?:^|/)target(?:/.*)?$''',
  '''(?:^|/)docs/fork/(?:ideal-base|normalization)/evidence(?:/.*)?$''',
  '''(?:^|/)crates/jcode-base/src/auth/cursor_tests\.rs$''',
  '''(?:^|/)crates/jcode-base/src/auth/reasonix\.rs$''',
  '''(?:^|/)crates/jcode-base/src/auth/claude_tests\.rs$''',
  '''(?:^|/)crates/jcode-base/src/auth/tests\.rs$''',
  '''(?:^|/)crates/jcode-base/src/gateway_tests\.rs$''',
  '''(?:^|/)crates/jcode-base/src/message/tests\.rs$''',
  '''(?:^|/)crates/jcode-base/src/session_tests/cases\.rs$''',
  '''(?:^|/)crates/jcode-base/src/storage/tests\.rs$''',
  '''(?:^|/)crates/jcode-provider-anthropic-runtime/src/lib\.rs$''',
  '''(?:^|/)scripts/repro/tls-bad-record-mac/src/main\.rs$''',
  '''(?:^|/)scripts/run_lifecycle_matrix\.sh$''',
  '''(?:^|/)tests/e2e/test_support/mod\.rs$''',
]

[[rules]]
id = "anthropic-oauth-token"
description = "Detects the repo's planted Anthropic OAuth and refresh token forms."
regex = '''\bsk-ant-(?:oat01|ort01|api03)-[A-Za-z0-9_-]{3,}\b'''
keywords = ["sk-ant-oat01", "sk-ant-ort01", "sk-ant-api03"]

[[rules]]
id = "openrouter-api-key"
description = "Detects the repo's planted OpenRouter API key form."
regex = '''\bsk-or-v1-[A-Za-z0-9_-]{3,}\b'''
keywords = ["sk-or-v1"]
