[package]
name = "jcode-provider-core"
version = "0.1.0"
publish = false
edition = "2024"

[lib]
name = "jcode_provider_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { workspace = true }
futures = "0.3"
httpdate = "1"
jcode-logging = { path = "../jcode-logging" }
jcode-message-types = { path = "../jcode-message-types" }
reqwest = { workspace = true, default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true, features = ["sync"] }
[dev-dependencies]
tokio = { workspace = true, features = ["sync", "macros", "rt"] }