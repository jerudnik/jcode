[package]
name = "jcode-provider-reasonix-runtime"
version = "0.1.0"
edition = "2024"
description = "Reasonix ACP provider policy for jcode"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
jcode-message-types = { path = "../jcode-message-types" }
jcode-provider-acp-runtime = { path = "../jcode-provider-acp-runtime" }
jcode-provider-core = { path = "../jcode-provider-core" }
serde_json = "1"

[dev-dependencies]
futures = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[[bin]]
name = "jcode-fake-reasonix-acp"
path = "src/bin/fake_acp.rs"
test = false
bench = false
