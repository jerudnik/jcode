[package]
name = "jcode-tui-markdown"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jcode-render-core = { path = "../jcode-render-core" }
jcode-tui-mermaid = { path = "../jcode-tui-mermaid", optional = true }
jcode-tui-workspace = { path = "../jcode-tui-workspace" }
jcode-storage = { path = "../jcode-storage" }
image = { version = "0.25", default-features = false, features = ["png"] }
pulldown-cmark = "0.12"
ratatui = "0.30"
serde = { workspace = true }
serde_json = { workspace = true }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
unicode-width = "0.2"
tempfile = "3"
wait-timeout = "0.2"

[features]
default = ["mermaid-renderer"]
mermaid-renderer = ["dep:jcode-tui-mermaid", "jcode-tui-mermaid/renderer"]

[dev-dependencies]
