[package]
name = "jcode-agent-runtime"
version = "0.1.0"
publish = false
edition = "2024"

[lib]
name = "jcode_agent_runtime"
path = "src/lib.rs"

[dependencies]
thiserror = "1"
tokio = { workspace = true, features = ["sync"] }
[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "time", "macros"] }