# Fork rail configuration for 4nix tooling (fork-status / fork-doctor).
# Consumed by `nix run github:jerudnik/4nix-utilities#fork-status` and friends.
#
# This is a hard fork (docs/BRANCHING.md): one rail, no vendor mirror, no
# packaging rail, and no automated sync. `upstream` remains declared as a
# read-only reference for manual cherry-picks only; nothing rebases onto it.
# The divergence point is the immutable `fork-point` tag.
[fork]
fork-remote = "github"
upstream-remote = "upstream"
upstream-branch = "master"
fork-point-tag = "fork-point"
main-branch = "main"
fork-repo = "jerudnik/jcode"
