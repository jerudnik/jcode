name: Governance Root

on:
  pull_request:

permissions: {}

jobs:
  governance-root:
    name: Governance Root
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Authorize exactly one externally reviewed transition
        env:
          ACTUAL_PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTUAL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTUAL_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          ACTUAL_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ACTUAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ACTUAL_BASE_REPOSITORY_ID: ${{ github.event.pull_request.base.repo.id }}
          ACTUAL_BASE_REF: ${{ github.event.pull_request.base.ref }}
          REVIEWED_PR_NUMBER: __REVIEWED_PR_NUMBER__
          REVIEWED_HEAD_SHA: __REVIEWED_HEAD_SHA__
          REVIEWED_HEAD_REPOSITORY_ID: __REVIEWED_HEAD_REPOSITORY_ID__
          REVIEWED_HEAD_REF: "__REVIEWED_HEAD_REF__"
          REVIEWED_BASE_SHA: __REVIEWED_BASE_SHA__
          REVIEWED_BASE_REPOSITORY_ID: __REVIEWED_BASE_REPOSITORY_ID__
          REVIEWED_BASE_REF: "__REVIEWED_BASE_REF__"
        run: |
          set -euo pipefail
          test "$ACTUAL_PR_NUMBER" = "$REVIEWED_PR_NUMBER"
          test "$ACTUAL_HEAD_SHA" = "$REVIEWED_HEAD_SHA"
          test "$ACTUAL_HEAD_REPOSITORY_ID" = "$REVIEWED_HEAD_REPOSITORY_ID"
          test "$ACTUAL_HEAD_REF" = "$REVIEWED_HEAD_REF"
          test "$ACTUAL_BASE_SHA" = "$REVIEWED_BASE_SHA"
          test "$ACTUAL_BASE_REPOSITORY_ID" = "$REVIEWED_BASE_REPOSITORY_ID"
          test "$ACTUAL_BASE_REF" = "$REVIEWED_BASE_REF"
          printf 'authorized reviewed transition pr=%s head=%s base=%s\n' \
            "$ACTUAL_PR_NUMBER" "$ACTUAL_HEAD_SHA" "$ACTUAL_BASE_SHA"
